[package]
name = "libdae"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8"
crossbeam-channel = "0.5"
evdev = { version = "0.13.*", features = ["serde"] }
nix = { version = "0.31", features = ["socket", "uio"] }
postcard = { version = "1.0.0", features = ["use-std"] }
rayon = "1.12"
serde = { version = "1.0.*", features = ["derive"] }
smithay-client-toolkit = "0.21"
wayland-protocols-wlr = "0.3"
wayland-client = "0.31"
