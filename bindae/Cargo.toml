[package]
name = "bindae"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8"
crossbeam-channel = "0.5"
libdae = { path = "../libdae" }
# TODO: Remove if not all features are used
# nix = { version = "0.31", features = ["socket", "uio", "poll", "time", "user"] }
nix = { version = "0.31", features = ["uio", "socket", "user"] }
# evdev = "0.13.2"
# postcard = { version = "1.0.0", features = ["use-std"] }
serde = { version = "1.0.*", features = ["derive"] }
