[package]
name = "client_lib"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam = "0.8"
crossbeam-channel = "0.5"
common_lib = {path = "../common_lib"}
# Remove evdev from client library.
evdev = { version = "0.13", features = ["serde"] }
nix = { version = "0.31", features = ["socket", "uio"] }
postcard = { version = "1.0.0", features = ["use-std"] }
serde = { version = "1.0.*", features = ["derive"] }
